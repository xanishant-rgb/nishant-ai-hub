<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nishant AI Hub</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      width: 100%;
      max-width: 600px;
    }
    .card {
      background-color: #1e293b;
      padding: 15px 20px;
      border-radius: 10px;
      text-align: center;
      text-decoration: none;
      color: #38bdf8;
      font-weight: bold;
      border: 1px solid #334155;
      transition: transform 0.2s, background-color 0.2s;
    }
    .card:hover {
      background-color: #334155;
      transform: translateY(-3px);
    }
  </style>
</head>
<body>

  <h1>Nishant AI Hub</h1>

  <div class="grid">
    <a href="https://chatgpt.com" target="_blank" class="card">ChatGPT</a>
    <a href="https://gemini.google.com" target="_blank" class="card">Google Gemini</a>
    <a href="https://claude.ai" target="_blank" class="card">Claude AI</a>
    <a href="https://platform.inceptionlabs.ai" target="_blank" class="card">Inception AI</a>
    <a href="https://www.typingmind.com" target="_blank" class="card">TypingMind</a>
    <a href="https://openrouter.ai" target="_blank" class="card">OpenRouter</a>
  </div>

</body>
</html>
